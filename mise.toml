[tasks."test:swift"]
description = "Run the Swift Readability fixture and API tests"
depends = ["test:install"]
run = """
set -euo pipefail
swift test -q -Xswiftc -suppress-warnings
"""

[tasks."test:install"]
description = "Install shared JavaScript fixture dependencies before either runner starts"
run = "npm --prefix Tests/JavaScript ci --ignore-scripts"

[tasks."test:javascript"]
description = "Run the JavaScript Readability parity suite against the shared fixture manifest"
depends = ["test:install"]
run = """
set -euo pipefail

if [ -z "${SWIFT_READABILITY_FIXTURES:-}" ] && [ -z "${SWIFT_READABILITY_FIXTURE_REGEX:-}" ]; then
  export SWIFT_READABILITY_FIXTURE_REGEX='.*'
fi

npm --prefix Tests/JavaScript test
"""

[tasks."test:parity"]
description = "Run Swift and JavaScript Readability against the shared fixture corpus"
depends = ["test:swift", "test:javascript"]
